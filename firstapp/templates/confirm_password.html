{% extends 'index.html' %}
{% load static %}
{% block content %}
	<!-- Start Banner Area -->
	<section class="banner-area organic-breadcrumb">
		<div class="container">
			<div class="breadcrumb-banner d-flex flex-wrap align-items-center justify-content-end">
				<div class="col-first">
					<h1>Register</h1>
					<nav class="d-flex align-items-center">
						<a href="{% url 'index' %}">Home<span class="lnr lnr-arrow-right"></span></a>
						<a href="#">Register</a>
					</nav>
				</div>
			</div>
		</div>
	</section>
	<!-- End Banner Area -->

	<!--================Login Box Area =================-->
	<section class="login_box_area section_gap">
		<div class="container">
			<div class="row">
				<div class="col-lg-6">
					<div class="login_box_img">
						<img class="img-fluid" src="{% static 'img/login.jpg' %}" alt="">
						<div class="hover">
							<h4>New to our website?</h4>
							<p>There are advances being made in science and technology everyday, and a good example of this is the</p>
							<!-- <a class="primary-btn" href="registration.html">Create an Account</a> -->
						</div>
					</div>
				</div>
				<div class="col-lg-6">
					<div class="login_form_inner">
						<h3>{{msg}}</h3>
						<h3>Confirm Password Here</h3>
						<form class="row login_form" action="{% url 'confirm_password' %}" method="post">
							{% csrf_token %}
							
							<div class="col-md-12 form-group">
								<input type="email" class="form-control" value="{{email}}" id="email" name="email" placeholder="Email" onfocus="this.placeholder = ''" onblur="this.placeholder = 'email'" required>
							</div>
                            <div class="col-md-12 form-group">
								<input type="number" class="form-control" id="otp" name="otp" placeholder="OTP" onfocus="this.placeholder = ''" onblur="this.placeholder = 'otp'" required>
							</div>
                            <div class="col-md-12 form-group">
								<input type="text" class="form-control" id="password" name="new_password" placeholder="New Password" onfocus="this.placeholder = ''" onblur="this.placeholder = 'new-Password'" required>
							</div>
                            <div class="col-md-12 form-group">
								<input type="text" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm Password" onfocus="this.placeholder = ''" onblur="this.placeholder = 'confirm-Password'" required>
							</div>
							
							<div class="col-md-12 form-group">
								<button type="submit" value="submit" class="primary-btn">Submit</button>
							</div>
						</form>
					</div>
				</div>
			</div>
			
		</div>
	</section>
	<!--================End Login Box Area =================-->

	{% endblock %}
